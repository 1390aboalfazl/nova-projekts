[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-lang"
version = "0.1.0"
description = "Experimental Nova language compiler"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
