[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-lang"
version = "0.2.0"
description = "Nova programming language — console-first interpreter with optional desktop GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nova Language Project"}]

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
